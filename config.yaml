# Configuración central. Los scripts leen de aquí todas las rutas, URLs y umbrales.

mongo:
  uri: "mongodb://admin:admin123@localhost:27017/"
  database: "upme_pdet"

paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  outputs: "outputs"

sources:
  mgn:
    version: "MGN2025"
    url: "https://geoportal.dane.gov.co/servicios/descarga-y-metadatos/datos-geoestadisticos/?cod=111"
    source_crs: "EPSG:4686"   # CRS declarado por el WFS; no es el .prj de un ZIP leído
    wfs:
      url: "https://portalgis.dane.gov.co/mparcgis/services/MGN2025/Serv_CapasMGN_2025/MapServer/WFSServer"
      type_name: "Serv_CapasMGN_2025:Municipio"
      srs_name: "urn:ogc:def:crs:EPSG::4686"
      page_size: 200
      start_indexes: [0, 200, 400, 600, 800, 1000]
      expected_feature_count: 1122   # municipios de la capa nacional; un recibo no puede cambiar este número
      axis_order: "latitude,longitude"
      rest_storage_crs: "EPSG:3857"
      receipt: "outputs/mgn_wfs_source_receipt.json"
  pdet_list:
    file: "resources/MunicipiosPDET.xlsx"
    sheet: "Hoja1"            # columnas: id, Subregión PDET, Código DANE Municipio, ...
    code_column: "Código DANE Municipio"   # viene como número: rellenar a 5 dígitos
    expected_municipalities: 170
    expected_subregions: 16
  microsoft:
    id: "ms"
    name: "Microsoft Global ML Building Footprints"
    license: "ODbL-1.0"
    url: "https://github.com/microsoft/GlobalMLBuildingFootprints"
    index_url: "https://minedbuildings.z5.web.core.windows.net/global-buildings/dataset-links.csv"
    country: "Colombia"                # valor de la columna Location del índice
    quadkey_zoom: 9                    # nivel de las particiones publicadas
    selection_buffer_deg: 0.01         # margen (~1 km) alrededor de los municipios PDET al elegir quadkeys
    raw_dir: "ms_buildings"            # bajo paths.raw_data; ignorado por git
    pdet_input: "data/processed/municipalities.geojsonl"
    pdet_input_report: "outputs/municipalities_prepare_report.json"
    manifest: "outputs/ms_buildings_download_manifest.json"
    coverage_csv: "outputs/ms_buildings_coverage.csv"
    prepare_report: "outputs/buildings_ms_prepare_report.json"              # compuerta para la carga
    prepare_by_municipality: "outputs/buildings_ms_prepared_by_municipality.csv"
    source_pass_report: "outputs/buildings_ms_source_pass_report.json"      # calidad sin capa PDET; nunca se carga
    load_report: "outputs/buildings_ms_load_report.json"
  google:
    id: "google"
    version: "v3"
    url: "https://sites.research.google/gr/open-buildings/"
    license: "CC-BY-4.0"
    index_url: "https://openbuildings-public-dot-gweb-research.uw.r.appspot.com/public/tiles.geojson"
    raw_dir: "google_buildings"
    pdet_input: "data/processed/municipalities.geojsonl"
    pdet_input_report: "outputs/municipalities_prepare_report.json"
    manifest: "outputs/google_buildings_download_manifest.json"
    prepare_report: "outputs/buildings_google_prepare_report.json"
    prepare_by_municipality: "outputs/buildings_google_prepared_by_municipality.csv"
    source_pass_report: "outputs/buildings_google_source_pass_report.json"
    load_report: "outputs/buildings_google_load_report.json"

processing:
  target_crs: "EPSG:4326"     # requerido por el índice 2dsphere de MongoDB
  batch_size: 10000
  buildings:                  # 03_prepare_buildings.py (Entrega 3)
    output_dir: "data/processed/buildings"   # una carpeta por fuente; ignorada por git
    pdet_input: "data/processed/municipalities.geojsonl"
    pdet_input_report: "outputs/municipalities_prepare_report.json"
    coordinate_precision: 7   # decimales de grado (~1 cm) para geometrías reparadas y centroides
    sliver_ratio: 0.01        # make_valid: se descartan partes menores si suman < 1 % del área

analysis:
  # Metodología definitiva y contrato compartido de la Entrega 4
  # (ver docs/delivery4/entrega4_metodologia_y_contrato.md y scripts/entrega4_contracts.py).
  # Todos los scripts de cálculo, comparación, validación y visualización leen de aquí.
  methodology:
    id: "upme-pdet-rooftop-stats"
    version: "entrega4-methodology-v1"
    base_source: "ms"
    contrast_source: "google"
    area_metric: "footprint_geodesic_wgs84_m2"   # área geodésica de huella, no área aprovechable
    usable_area_factor: null                     # sin factor de aprovechamiento sin respaldo
    spatial_assignment: "centroid_intersects_min_divipola_tiebreak"
    empty_municipality_stats: "null"             # mean_area_m2 y median_area_m2 en null si building_count = 0
    missing_confidence_policy:
      ms: "ignore_unfiltered"                    # Microsoft no publica confianza (99,9994 % null en PDET)
      google: "exclude_as_low_confidence"        # Google publica confianza; ausente o < min_confidence se excluye
    outlier_policy: "retain_all_above_min_area"  # se conservan huellas grandes y se reportan media y mediana
  min_area_m2: 20             # huellas menores no se cuentan como techo (casetas, ruido del modelo)
  max_area_m2: null           # sin tope: las huellas grandes (bodegas, instalaciones) se conservan
  min_confidence: 0.70        # aplicado solo a las fuentes de confidence_sources
  confidence_sources: ["google"]   # Microsoft no trae confianza (1.761.020 de 1.761.030 en null en PDET)
  filter_order: ["below_min_area", "above_max_area", "low_confidence"]
  google_low_coverage_rule:
    ratio_threshold: 0.20     # 5 * google_buildings < ms_buildings (estricto) sobre EDA Entrega 3
    basis: "entrega3_eda_unfiltered"
    reference_eda: "outputs/eda/eda_buildings_summary.json"
  # 15 municipios con cobertura insuficiente de Google (< 20 % de las edificaciones de
  # Microsoft en el EDA Entrega 3). Verificado contra outputs/eda/eda_buildings_summary.json.
  google_low_coverage: ["05475", "05873", "19418", "27099", "27150", "27205", "27250",
                        "27425", "27450", "27491", "27615", "27745", "52612", "52621", "73616"]
  rooftop_stats:
    collection: "rooftop_stats"
    csv: "outputs/rooftop_stats_{source}.csv"
    report: "outputs/rooftop_stats_{source}_report.json"
  comparison:
    municipalities: "outputs/pdet_mgn_crosswalk.csv"
    reference_eda: "outputs/eda/eda_buildings_summary.json"
    output_dir: "outputs/delivery4"
